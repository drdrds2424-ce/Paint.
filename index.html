<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>عيادة الدكتور علي محمد الجشعمي</title>
    <!-- استدعاء خط Cairo الاحترافي -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&display=swap" rel="stylesheet">
    
    <style>
        * { box-sizing: border-box; font-family: 'Cairo', sans-serif; }
        body { background: #f1f5f9; margin: 0; padding: 20px 10px; color: #1e293b; }
        .container { max-width: 550px; margin: 0 auto; background: #ffffff; padding: 25px; border-radius: 16px; box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.05); }
        
        .doctor-header { text-align: center; margin-bottom: 25px; padding-bottom: 15px; border-bottom: 2px solid #e2e8f0; }
        .doctor-title { font-size: 22px; font-weight: 800; color: #0f172a; margin: 0 0 5px 0; }
        .doctor-sub { font-size: 14px; color: #64748b; font-weight: 600; margin: 0; }
        
        .day-badge { background: #e0f2fe; color: #0369a1; text-align: center; font-weight: 700; font-size: 15px; padding: 8px 15px; border-radius: 30px; margin-bottom: 20px; }
        
        .schedule-table { width: 100%; border-collapse: separate; border-spacing: 0; margin-bottom: 25px; border-radius: 10px; overflow: hidden; border: 1px solid #e2e8f0; }
        .schedule-table th, .schedule-table td { padding: 12px; text-align: center; font-size: 14px; }
        .schedule-table th { background-color: #0f172a; color: #ffffff; font-weight: 700; }
        .schedule-table td { border-bottom: 1px solid #f1f5f9; }
        
        .status-badge { display: inline-block; padding: 4px 12px; border-radius: 12px; font-weight: 700; font-size: 12px; color: white; }
        .available { background-color: #10b981; }
        .booked { background-color: #ef4444; }

        .form-title { font-size: 16px; font-weight: 700; color: #0f172a; margin-bottom: 15px; text-align: center; }
        .form-group { margin-bottom: 15px; }
        label { display: block; margin-bottom: 6px; font-weight: 600; color: #475569; font-size: 13px; }
        input, textarea, select { width: 100%; padding: 12px; border: 1.5px solid #cbd5e1; border-radius: 10px; font-size: 14px; outline: none; transition: border-color 0.2s; background: #fafafa; }
        input:focus, textarea:focus, select:focus { border-color: #25D366; background: #ffffff; }
        
        .btn-whatsapp { width: 100%; padding: 14px; background: #25D366; color: white; border: none; border-radius: 10px; font-size: 16px; font-weight: 700; cursor: pointer; transition: background 0.2s; }
        .btn-whatsapp:hover { background: #1eb854; }
    </style>
</head>
<body>

<div class="container">
    <div class="doctor-header">
        <h1 class="doctor-title">عيادة الدكتور علي محمد الجشعمي</h1>
        <p class="doctor-sub">نظام حجز المواعيد الإلكتروني</p>
    </div>

    <div class="day-badge" id="dayTitle">جدول المواعيد</div>
    
    <table class="schedule-table">
        <thead>
            <tr>
                <th>رقم الحجز</th>
                <th>الوقت التقديري</th>
                <th>الحالة</th>
            </tr>
        </thead>
        <tbody id="patientScheduleBody"></tbody>
    </table>

    <div class="form-title">تعبئة استمارة الحجز</div>
    <form id="bookingForm">
        <div class="form-group">
            <label>اختر رقم الحجز المتاح:</label>
            <select id="slotSelect" required></select>
        </div>
        <div class="form-group">
            <label>اسم المريض الكامل:</label>
            <input type="text" id="name" placeholder="أدخل اسمك الثلاثي" required>
        </div>
        <div class="form-group">
            <label>رقم الهاتف:</label>
            <input type="tel" id="phone" placeholder="07xxxxxxxx" required>
        </div>
        <div class="form-group">
            <label>العنوان / السكن:</label>
            <input type="text" id="address" placeholder="المحافظة - المنطقة" required>
        </div>
        <div class="form-group">
            <label>تفاصيل الحجز / الأعراض:</label>
            <textarea id="notes" rows="3" placeholder="اكتب سبب الزيارة..." required></textarea>
        </div>
        <button type="submit" class="btn-whatsapp">تأكيد إرسال الحجز عبر الواتساب</button>
    </form>
</div>

<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>

<script>
    const firebaseConfig = {
      apiKey: "AIzaSyA083dRD4EYwVj-Y--AsqOzpz7ewhZlmYo",
      authDomain: "clinic-system-98d2e.firebaseapp.com",
      databaseURL: "https://clinic-system-98d2e-default-rtdb.firebaseio.com",
      projectId: "clinic-system-98d2e",
      storageBucket: "clinic-system-98d2e.firebasestorage.app",
      messagingSenderId: "1025874349100",
      appId: "1:1025874349100:web:6fe72cebe668705a4c1589"
    };

    firebase.initializeApp(firebaseConfig);
    const db = firebase.database();
    
    // رقم الواتساب المحدد للعيادة
    const DOCTOR_PHONE = "9647854777816";

    db.ref('clinic_day').on('value', snapshot => {
        const day = snapshot.val() || "اليوم";
        document.getElementById('dayTitle').textContent = "جدول المواعيد - " + day;
    });

    db.ref().on('value', snapshot => {
        const data = snapshot.val() || {};
        const slots = data.slots || [
            { id: 1, time: "04:00 مساءً" },
            { id: 2, time: "04:30 مساءً" },
            { id: 3, time: "05:00 مساءً" },
            { id: 4, time: "05:30 مساءً" },
            { id: 5, time: "06:00 مساءً" }
        ];
        const bookings = data.bookings || {};

        const scheduleBody = document.getElementById('patientScheduleBody');
        const slotSelect = document.getElementById('slotSelect');
        
        scheduleBody.innerHTML = '';
        slotSelect.innerHTML = '<option value="">-- اختر رقماً متاحاً --</option>';

        slots.forEach(slot => {
            const isBooked = !!bookings[slot.id];
            const row = document.createElement('tr');
            const statusText = isBooked ? 'محجوز' : 'متاح';
            const statusClass = isBooked ? 'booked' : 'available';

            row.innerHTML = `<td><strong>#${slot.id}</strong></td>
                            <td>${slot.time}</td>
                            <td><span class="status-badge ${statusClass}">${statusText}</span></td>`;
            
            scheduleBody.appendChild(row);

            if (!isBooked) {
                const option = document.createElement('option');
                option.value = slot.id;
                option.textContent = `حجز رقم #${slot.id} (${slot.time})`;
                slotSelect.appendChild(option);
            }
        });
    });

    document.getElementById('bookingForm').addEventListener('submit', function(e) {
        e.preventDefault();
        
        const selectedSlotId = document.getElementById('slotSelect').value;
        if (!selectedSlotId) return alert("يرجى اختيار رقم حجز متاح");

        db.ref('slots').once('value').then(snapshot => {
            const slots = snapshot.val() || [];
            const slotInfo = slots.find(s => s.id == selectedSlotId);

            const bookingData = {
                slotId: selectedSlotId,
                time: slotInfo ? slotInfo.time : '',
                name: document.getElementById('name').value,
                phone: document.getElementById('phone').value,
                address: document.getElementById('address').value,
                notes: document.getElementById('notes').value,
                timestamp: Date.now()
            };

            // حفظ في Firebase وتحويل إلى الواتساب
            db.ref('bookings/' + selectedSlotId).set(bookingData).then(() => {
                db.ref('clinic_day').once('value').then(daySnap => {
                    const currentDay = daySnap.val() || 'اليوم';
                    const message = `*طلب حجز موعد - عيادة د. علي محمد الجشعمي*\n\n` +
                        `*اليوم:* ${currentDay}\n` +
                        `*رقم الحجز:* #${bookingData.slotId}\n` +
                        `*الموعد:* ${bookingData.time}\n` +
                        `*الاسم:* ${bookingData.name}\n` +
                        `*الهاتف:* ${bookingData.phone}\n` +
                        `*العنوان:* ${bookingData.address}\n` +
                        `*التفاصيل:* ${bookingData.notes}`;

                    window.open(`https://wa.me/${DOCTOR_PHONE}?text=${encodeURIComponent(message)}`, '_blank');
                    document.getElementById('bookingForm').reset();
                });
            });
        });
    });
</script>
</body>
</html>
